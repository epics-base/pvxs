name: 'PVXS ABI capture'
description: >-
  Capture ABI/API evidence for libpvxs and libpvxsIoc from an installation
  that a normal PVXS build has already produced. Performs no build, no
  comparison and no reporting.

  What is PVXS-specific lives here: where the EPICS dependency was prepared
  and which host architecture it built for. Everything else -- selecting the
  real shared object out of its SONAME alias chain, checking it is an ELF
  ET_DYN, agreeing the target machine between components, expanding the owned
  header sets and refusing a stale exclusion -- belongs to abicheck's own
  baseline Action, which reads the component declaration in
  .ci-local/abicheck-components.json.

  Used by the selected matrix leg of ci-scripts-build.yml (the candidate
  capture) and by abicheck-baseline.yml's one-time historical bootstrap, so
  the two produce identical baseline-sets from one definition.

inputs:
  top:
    description: >
      Root of the built PVXS tree to capture from. Defaults to the workspace;
      the historical bootstrap builds into its own directory and points this
      at it.
    required: false
    default: ''
  output-dir:
    description: 'Directory to write the baseline-set into.'
    required: true
  project-ref:
    description: >
      The revision actually built and analysed, recorded in the manifest.
      For a pull_request build this is the merge commit, not the PR head.
    required: true
  profile:
    description: 'Build-profile identifier recorded in the manifest.'
    required: true
  baseline-generation:
    description: 'Scanner-compatibility generation recorded in the manifest.'
    required: false
    default: '1'
  build-config:
    description: 'Path to the abicheck extraction config.'
    required: false
    default: '.ci-local/abicheck.yml'
  component-spec:
    description: 'Path to the PVXS component declaration.'
    required: false
    default: '.ci-local/abicheck-components.json'
  abicheck-ref:
    description: 'Immutable abicheck revision the capture runs from.'
    required: true

outputs:
  baseline-path:
    description: 'The baseline-set directory that was written.'
    value: ${{ steps.capture.outputs.baseline-path }}
  content-digest:
    description: "Digest over the manifest's artifact list."
    value: ${{ steps.capture.outputs.content-digest }}
  resolved-libraries:
    description: 'The concrete artifact/header/include set that was dumped.'
    value: ${{ steps.capture.outputs.resolved-libraries }}
  machine:
    description: 'The ELF machine both components agreed on (e.g. EM_X86_64).'
    value: ${{ steps.capture.outputs.machine }}

runs:
  using: 'composite'
  steps:
    # The only project-specific knowledge left: where cue.py put EPICS Base
    # and which host arch it built for.  These are build-system facts, not
    # ABI facts, so abicheck deliberately hard-codes neither.
    - name: Resolve EPICS build context
      id: epics
      shell: bash
      env:
        TOP: ${{ inputs.top || github.workspace }}
        SPEC_IN: ${{ inputs.component-spec }}
        CFG_IN: ${{ inputs.build-config }}
        WORKSPACE: ${{ github.workspace }}
        SPEC_OUT: ${{ runner.temp }}/abicheck-components.resolved.json
      run: |
        set -eu

        # The declaration belongs to the CHECKOUT, not to the tree being
        # captured.  The historical bootstrap points `top` at an old
        # revision that predates this file entirely, so resolving a
        # relative spec path after `cd "$TOP"` would read a file that is
        # missing (or, worse, a stale declaration) from that revision.
        case "$SPEC_IN" in
          /*) spec_in=$SPEC_IN ;;
          *)  spec_in=$WORKSPACE/$SPEC_IN ;;
        esac
        [ -f "$spec_in" ] || {
          echo "::error::component declaration $spec_in does not exist"
          exit 64
        }

        # Same reasoning for the extraction config.  It resolved correctly
        # only by accident: a `uses:` step runs with cwd = workspace, so a
        # relative path happened to land in the trusted checkout.  Make the
        # trusted origin explicit rather than depending on the runner's cwd.
        case "$CFG_IN" in
          "")  cfg_in= ;;
          /*)  cfg_in=$CFG_IN ;;
          *)   cfg_in=$WORKSPACE/$CFG_IN ;;
        esac
        if [ -n "$cfg_in" ] && [ ! -f "$cfg_in" ]; then
          echo "::error::extraction config $cfg_in does not exist"
          exit 64
        fi

        cd "$TOP"

        # configure/RELEASE.local is where cue.py records the prepared
        # dependency.  We read it; we never rewrite it.
        if [ -z "${EPICS_BASE:-}" ] && [ -f configure/RELEASE.local ]; then
          EPICS_BASE=$(sed -n -E 's/^[[:space:]]*EPICS_BASE[[:space:]]*=[[:space:]]*//p' \
            configure/RELEASE.local | tail -n 1)
        fi
        [ -n "${EPICS_BASE:-}" ] || {
          echo "::error::EPICS_BASE is not set and configure/RELEASE.local does not name it"
          exit 64
        }

        EPICS_HOST_ARCH=${EPICS_HOST_ARCH:-}
        if [ -z "$EPICS_HOST_ARCH" ] && [ -x "$EPICS_BASE/startup/EpicsHostArch" ]; then
          EPICS_HOST_ARCH=$("$EPICS_BASE/startup/EpicsHostArch")
        fi
        case "$EPICS_HOST_ARCH" in
          linux-*) ;;
          *)
            echo "::error::this capture is declared for a native Linux host arch, got '${EPICS_HOST_ARCH:-<unset>}'"
            exit 64
            ;;
        esac

        # Bind the two build-system values into the declaration.
        #
        # This is a JSON document, so the binding is done by a JSON reader
        # and writer.  Textual substitution is not JSON escaping: measured
        # against the real declaration, `sed` mangles a value containing
        # `&` (which means "the whole match" in a replacement), emits
        # invalid JSON for one containing `"`, drops a backslash, and fails
        # outright on one containing the `|` delimiter.  EPICS_BASE is a
        # path from configure/RELEASE.local, so it is not ours to constrain.
        #
        # Exactly two names are bound and any other ${...} is refused, so
        # this stays a two-variable binding rather than growing into a
        # local templating language.
        SPEC_IN_ABS=$spec_in EPICS_BASE=$EPICS_BASE \
        EPICS_HOST_ARCH=$EPICS_HOST_ARCH SPEC_OUT=$SPEC_OUT \
        python3 - <<'PY'
        import json, os, re, sys

        bind = {
            "EPICS_BASE": os.environ["EPICS_BASE"],
            "EPICS_HOST_ARCH": os.environ["EPICS_HOST_ARCH"],
        }
        placeholder = re.compile(r"\$\{([A-Za-z_][A-Za-z0-9_]*)\}")

        def sub(text):
            def one(m):
                name = m.group(1)
                if name not in bind:
                    sys.exit(
                        "::error::%s is not a value this capture binds; "
                        "known: %s" % (name, ", ".join(sorted(bind)))
                    )
                return bind[name]
            return placeholder.sub(one, text)

        def walk(node):
            if isinstance(node, str):
                return sub(node)
            if isinstance(node, list):
                return [walk(v) for v in node]
            if isinstance(node, dict):
                return {walk(k): walk(v) for k, v in node.items()}
            return node

        with open(os.environ["SPEC_IN_ABS"]) as f:
            try:
                spec = json.load(f)
            except json.JSONDecodeError as exc:
                sys.exit("::error::%s is not valid JSON: %s"
                         % (os.environ["SPEC_IN_ABS"], exc))

        with open(os.environ["SPEC_OUT"], "w") as f:
            json.dump(walk(spec), f, indent=2, sort_keys=True)
        PY

        echo "epics-base=$EPICS_BASE" >> "$GITHUB_OUTPUT"
        echo "host-arch=$EPICS_HOST_ARCH" >> "$GITHUB_OUTPUT"
        echo "spec=$SPEC_OUT" >> "$GITHUB_OUTPUT"
        echo "build-config=$cfg_in" >> "$GITHUB_OUTPUT"
        echo "resolved component declaration:"
        cat "$SPEC_OUT"

    - name: Capture ABI snapshots (libpvxs, libpvxsIoc)
      id: capture
      uses: abicheck/abicheck/actions/baseline@80cf72abb5856eb623a6056fb35d06a66ad26774
      with:
        library-spec: ${{ steps.epics.outputs.spec }}
        library-root: ${{ inputs.top || github.workspace }}
        output-dir: ${{ inputs.output-dir }}
        project-ref: ${{ inputs.project-ref }}
        profile: ${{ inputs.profile }}
        depth: headers
        build-config: ${{ steps.epics.outputs.build-config }}
        baseline-generation: ${{ inputs.baseline-generation }}
        generator-action-ref: ${{ inputs.abicheck-ref }}
        # A libpvxs snapshot is ~124 MB of JSON at this depth (measured).
        # The decoded content is identical either way.
        snapshot-compression: zstd
