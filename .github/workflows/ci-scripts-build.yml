# .github/workflows/ci-scripts-build.yml for use with EPICS Base ci-scripts
# (see: https://github.com/epics-base/ci-scripts)

# This is YAML - indentation levels are crucial

name: PVXS EPICS

# Trigger on pushes and PRs to any branch
on:
  push:
    paths-ignore:
      - .appveyor.yml
      - setup.py
      - MANIFEST.in
      - pyproject.toml
      - python/*
  pull_request:
  workflow_dispatch:

# The analysis side is unprivileged on purpose.  A contributor's fork PR
# builds and analyses here with no write access and no secrets; publishing
# the result to the PR is a separate, trusted workflow_run job
# (.github/workflows/abicheck-report.yml).
permissions:
  contents: read

env:
  SETUP_PATH: .ci-local
  CMP: gcc
  _PVXS_ABORT_ON_CRIT: 1
  PVXS_LOG: pvxs.*=WARN
  # Baseline identity is more than a version number: this names the exact
  # build arrangement the captured snapshots and every baseline they are
  # compared against must share -- native Linux x86_64, GCC, default
  # (shared) configuration, EPICS Base 7.0, and PVXS's own bundled
  # libevent rather than the system one.
  ABICHECK_PROFILE: linux-x86_64-gcc-default-base7.0-bundled-libevent
  # One immutable, merged abicheck revision for every Action reference.
  ABICHECK_REF: e38c3f91b8f956f7c8fa51b60d17fc4030969dec

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Set environment variables from matrix parameters
    env:
      SET: ${{ matrix.set || 'defaults' }}
      CMP: ${{ matrix.cmp }}
      BCFG: ${{ matrix.configuration }}
      BASE: ${{ matrix.base }}
      CI_CROSS_TARGETS: ${{ matrix.cross }}
      LIBEVENT_TAG: ${{ matrix.libevent }}
      TEST: ${{ matrix.test }}
      EXTRA: ${{ matrix.extra }}
      VV: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native Linux (WError)
            os: ubuntu-latest
            cmp: gcc
            configuration: default
            base: "7.0"
            extra: "CMD_CPPFLAGS=-Werror"
            doc: 1
            # The one configuration that additionally captures ABI/API
            # evidence for the advisory abicheck shadow check.  Native
            # Linux, GCC, shared libraries, bundled libevent -- the
            # profile the published baselines are built for.  Every other
            # leg is untouched.
            abicheck: 1

          - name: Native Linux (libc++ debug)
            os: ubuntu-latest
            cmp: gcc
            configuration: default
            base: "7.0"
            # https://gcc.gnu.org/onlinedocs/libstdc++/manual/using_macros.html
            extra: "CMD_CPPFLAGS=\"-D_GLIBCXX_ASSERTIONS -D_GLIBCXX_DEBUG -D_GLIBCXX_DEBUG_PEDANTIC\""
            doc: 1

          - name: Native Linux (c++17)
            os: ubuntu-latest
            cmp: gcc
            configuration: default
            base: "7.0"
            extra: "CMD_CXXFLAGS=-std=c++17"

          - name: Cross mingw64 DLL
            os: ubuntu-latest
            cmp: gcc
            configuration: default
            base: "7.0"
            cross: "windows-x64-mingw"

          - name: Cross mingw64 static
            os: ubuntu-latest
            cmp: gcc
            configuration: static
            base: "7.0"
            cross: "windows-x64-mingw"

          - name: RTEMS5
            os: ubuntu-22.04
            cmp: gcc
            configuration: default
            base: "7.0"
            cross: "RTEMS-pc686-qemu@5"
 
          - name: Native Linux with clang
            os: ubuntu-latest
            cmp: clang
            configuration: default
            base: "7.0"

          - name: Native Linux with clang ubsan
            os: ubuntu-latest
            cmp: clang
            configuration: default
            base: "7.0"
            extra: "CMD_CFLAGS=-fsanitize=undefined CMD_CXXFLAGS=-fsanitize=undefined CMD_LDFLAGS=-fsanitize=undefined"

          - name: Native Linux with libevent stable
            os: ubuntu-latest
            cmp: gcc
            configuration: default
            base: "7.0"
            libevent: "release-2.1.12-stable"

          - name: Native Linux with 7.0.2
            os: ubuntu-latest
            cmp: gcc
            configuration: default
            set: "nofortify"
            base: "R7.0.2"
            extra: "CMD_CPPFLAGS=\"-U_FORTIFY_SOURCE\""

          - name: Native Linux with 3.15
            os: ubuntu-latest
            cmp: gcc
            configuration: default
            set: "nofortify"
            base: "3.15"
            extra: "CMD_CPPFLAGS=\"-U_FORTIFY_SOURCE\""

          - name: Native Linux with 3.14
            os: ubuntu-latest
            cmp: gcc
            configuration: default
            set: "nofortify"
            base: "3.14"
            extra: "CMD_CPPFLAGS=\"-U_FORTIFY_SOURCE\""

          - name: OSX
            os: macos-latest
            cmp: clang
            configuration: default
            base: "7.0"

          - name: vs2022 DLL
            os: windows-2022
            cmp: vs2022
            configuration: debug
            base: "7.0"
            extra: "CMD_CXXFLAGS=-analyze"

          - name: vs2022 static
            os: windows-2022
            cmp: vs2022
            configuration: static-debug
            base: "7.0"
            extra: "CMD_CXXFLAGS=-analyze"

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "apt-get install"
      run: |
        sudo apt-get update
        sudo apt-get -y install libreadline-dev g++-mingw-w64-x86-64 cmake gdb qemu-system-x86
      if: runner.os == 'Linux'
    - name: Automatic core dumper analysis
      uses: mdavidsaver/ci-core-dumper@master
    - name: Prepare and compile dependencies
      run: python .ci/cue.py prepare
    - name: Build libevent
      run: python .ci/cue.py exec python .ci-local/libevent.py
    - name: Build main module
      id: build-main
      run: python .ci/cue.py build
    - name: Generate Docs
      if: matrix.doc
      run: |
        sudo apt-get -y install doxygen python-is-python3 python3-breathe inkscape
        make -C documentation
    - name: otool
      if: ${{ always() && runner.os == 'macOS' }}
      run: otool -D -L -l bundle/usr/*/lib/*.dylib lib/*/*.dylib bin/*/pvxinfo
    - name: readelf
      if: ${{ always() && runner.os == 'Linux' && matrix.base != '3.14' }}
      run: find bundle/usr lib -name '*.so' -print0 | xargs -0 readelf -d bin/linux-*/pvxinfo
    - name: Host info
      if: ${{ matrix.base != '3.14' }}
      run: python .ci/cue.py --add-path "{TOP}/bin/{EPICS_HOST_ARCH}" --add-path "{TOP}/bundle/usr/{EPICS_HOST_ARCH}/lib" exec pvxinfo -D
    - name: Test env setup
      run: echo "UBSAN_OPTIONS=log_path=$PWD/UBSAN:suppressions=$PWD/.ci-local/ubsan.supp:report_error_type=1:print_stacktrace=1" >> $GITHUB_ENV
    - name: Run main module tests
      run: python -m ci_core_dumper exec python .ci/cue.py -T 5M --add-path "{TOP}/bundle/usr/{EPICS_HOST_ARCH}/lib" test
    - name: Collect and show test results
      if: ${{ always() }}
      run: python .ci/cue.py test-results
    - name: Show UBSAN logs
      shell: bash
      if: ${{ always() }}
      run: |
        ret=0
        for ff in `find . -name 'UBSAN*'`
        do
          echo "==== $ff ===="
          cat "$ff"
          ret=1
        done
        exit $ret
    - name: CDT Check
      run: ./.ci-local/cdt-check.sh
      if: runner.os == 'Linux'
    - name: Troubleshoot
      if: ${{ always() }}
      shell: bash
      run: grep . cfg/*
    - name: Upload tapfiles Artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: tapfiles ${{ matrix.name }}
        path: '**/O.*/*.tap'
        if-no-files-found: ignore

    # ── ABI/API evidence capture (advisory; ABICC stays authoritative) ────
    #
    # Reuses the build this job already did: no second build, no second
    # dependency preparation, no source-tree input. The capture reads the
    # headers in include/pvxs and the shared objects in lib/$EPICS_HOST_ARCH
    # that `cue.py build` installed, plus the EPICS Base include roots
    # `cue.py prepare` set up.
    #
    # It runs last, after this job's own tests, so nothing else that needs
    # this checkout is disturbed, and it runs even when those tests failed
    # (an unrelated red test must not hide an ABI finding) as long as the
    # build produced an installation to look at.
    #
    # Depth is L2 -- exported symbols and debug info plus the public header
    # AST. Build-flag and toolchain drift (L3) are not covered.
    - name: Capture ABI snapshots (libpvxs, libpvxsIoc)
      id: abi-capture
      if: ${{ always() && matrix.abicheck && steps.build-main.outcome == 'success' }}
      uses: ./.github/actions/abicheck-capture
      with:
        output-dir: ${{ runner.temp }}/abicheck-candidate
        # The revision actually built and analysed here. For a pull_request
        # this is the merge commit, NOT the PR head.
        project-ref: ${{ github.sha }}
        profile: ${{ env.ABICHECK_PROFILE }}
        abicheck-ref: ${{ env.ABICHECK_REF }}

    - name: Upload ABI snapshots
      if: ${{ always() && steps.abi-capture.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        retention-days: 30
        name: abicheck-candidate-${{ env.ABICHECK_PROFILE }}
        path: ${{ runner.temp }}/abicheck-candidate
        if-no-files-found: error

    - name: Note a failed ABI capture
      if: ${{ always() && matrix.abicheck && steps.build-main.outcome == 'success' && steps.abi-capture.outcome != 'success' }}
      run: |
        echo "::warning::ABI capture did not complete (outcome: ${{ steps.abi-capture.outcome }}); the comparison job will report an incomplete analysis, not a clean result."

  # ── ABI/API comparison (advisory; ABICC stays authoritative) ────────────
  #
  # Consumes the snapshots the selected native leg captured in THIS run. Both
  # operands of every comparison are snapshots, so no compiler, no castxml
  # and no EPICS checkout are needed here, and each component is extracted
  # once for both baseline channels.
  #
  # `needs: native` waits for the whole matrix -- GitHub cannot depend on a
  # single leg -- but `if: always()` means an unrelated red leg never
  # suppresses an available ABI finding.
  abicheck:
    name: ABI/API check (advisory)
    needs: native
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Only to list this repository's own default-branch runs when
      # resolving the accepted-main baseline. No write scope, no secrets.
      actions: read
    env:
      REPORT_DIR: ${{ github.workspace }}/abicheck-reports
      # Outside REPORT_DIR: actions/aggregate refuses a manifest inside the
      # directory it globs. Not runner.temp -- the `runner` context is not
      # available in a job env block, and referencing it there makes the
      # whole workflow file invalid.
      EXPECTED_TARGETS: ${{ github.workspace }}/abicheck-expected-targets.json
      CANDIDATE_DIR: ${{ github.workspace }}/abicheck-candidate
      BASELINE_RELEASE_DIR: ${{ github.workspace }}/abicheck-baseline-release
      BASELINE_MAIN_DIR: ${{ github.workspace }}/abicheck-baseline-main
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Download candidate snapshots
      id: candidate
      # A missing artifact is a real outcome this job reports as an
      # incomplete analysis, not a step that silently succeeds.
      continue-on-error: true
      uses: actions/download-artifact@v7
      with:
        name: abicheck-candidate-${{ env.ABICHECK_PROFILE }}
        path: ${{ env.CANDIDATE_DIR }}

    # Both channel directories always exist, so a staging failure reaches
    # resolve-baseline as its own `not_found` outcome on a declared check
    # rather than as a skipped step that would vanish from the expected set.
    - name: Prepare the baseline channel directories
      run: mkdir -p "$BASELINE_MAIN_DIR" "$BASELINE_RELEASE_DIR"

    # ── Baseline staging ─────────────────────────────────────────────
    # Two distinct questions, two distinct channels, never merged:
    #   accepted-main    what did THIS pull request introduce?
    #   release-contract what changed since the selected supported release?
    #
    # Eligibility is abicheck's (verify-baseline-source); fetching the bytes
    # is ours, because only we know where we published them.
    - name: Stage the release-contract baseline
      if: ${{ steps.candidate.outcome == 'success' }}
      id: baseline-release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eu
        asset="abicheck-baseline-${ABICHECK_PROFILE}.tar.zst"
        # gh defaults both exclusions to false, so --limit 1 alone can
        # select a draft or a pre-release. The release contract is a
        # published final release.
        tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                --exclude-drafts --exclude-pre-releases --json tagName \
                --jq '.[0].tagName // empty')
        if [ -z "$tag" ]; then
          echo "no release to resolve a release-contract baseline from"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
          --pattern "$asset" --dir "$BASELINE_RELEASE_DIR"

    # Which run may supply this pull request's base baseline. Repository,
    # workflow, event, branch, head SHA and conclusion are all checked and
    # every rejection is printed, so "no eligible baseline" can say what it
    # did see; not_found and lookup_failed stay distinct outcomes.
    - name: Verify the accepted-main baseline source
      if: ${{ steps.candidate.outcome == 'success' && github.event_name == 'pull_request' }}
      id: base-source
      continue-on-error: true
      uses: abicheck/abicheck/actions/verify-baseline-source@e38c3f91b8f956f7c8fa51b60d17fc4030969dec
      with:
        mode: producer-run
        workflow: .github/workflows/ci-scripts-build.yml
        expect-event: push
        expect-head-sha: ${{ github.event.pull_request.base.sha }}
        expect-head-branch: ${{ github.event.pull_request.base.ref }}

    - name: Stage the accepted-main baseline
      if: ${{ steps.base-source.outputs.eligible == 'true' }}
      id: baseline-main
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ steps.base-source.outputs.run-id }}
      run: |
        set -eu
        if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
             --name "abicheck-candidate-${ABICHECK_PROFILE}" --dir "$BASELINE_MAIN_DIR"; then
          echo "::warning::eligible baseline run $RUN_ID has no abicheck-candidate-$ABICHECK_PROFILE artifact (expired or never produced)"
          exit 1
        fi

    # ── Comparison ───────────────────────────────────────────────
    # One check-target invocation per (component, channel). All four read the
    # same two candidate snapshots: nothing re-extracts, and nothing
    # re-compares for rendering.
    #
    # Resolution runs the full per-target check set -- content digest,
    # profile, project_ref, generation, schema and path-escape -- on the
    # CANDIDATE side, not only the baseline side.
    - name: Locate candidate snapshots
      id: snapshots
      if: ${{ steps.candidate.outcome == 'success' }}
      uses: abicheck/abicheck/actions/resolve-baseline@e38c3f91b8f956f7c8fa51b60d17fc4030969dec
      with:
        kind: members
        baseline-path: ${{ env.CANDIDATE_DIR }}
        channel: candidate
        bundle-members: '["libpvxs", "libpvxsIoc"]'
        profile: ${{ env.ABICHECK_PROFILE }}
        expected-project-ref: ${{ github.sha }}
        expected-baseline-generation: '1'

    # The accepted-main checks exist only on a pull request: there is no PR
    # base to compare against on a push or tag build, and declaring them
    # there would manufacture unavailable checks for a question the event
    # never asked. That event policy is the `if:` below, and it is the only
    # place it is stated.
    - name: 'libpvxs vs accepted-main'
      id: main-core
      if: ${{ always() && steps.snapshots.outcome == 'success' && github.event_name == 'pull_request' }}
      uses: abicheck/abicheck/actions/check-target@e38c3f91b8f956f7c8fa51b60d17fc4030969dec
      with:
        name: libpvxs
        profile: ${{ env.ABICHECK_PROFILE }}
        baseline-channel: accepted-main
        baseline-path: ${{ env.BASELINE_MAIN_DIR }}
        baseline-required: 'false'
        expected-project-ref: ${{ github.event.pull_request.base.sha }}
        expected-baseline-generation: '1'
        requested-depth: headers
        gate-mode: advisory
        new-library: ${{ fromJSON(steps.snapshots.outputs.snapshot-paths).libpvxs }}
        build-config: .ci-local/abicheck.yml
        head-sha: ${{ github.sha }}
        base-ref: ${{ github.event.pull_request.base.ref }}
        severity-preset: default

    - name: 'libpvxsIoc vs accepted-main'
      id: main-ioc
      if: ${{ always() && steps.snapshots.outcome == 'success' && github.event_name == 'pull_request' }}
      uses: abicheck/abicheck/actions/check-target@e38c3f91b8f956f7c8fa51b60d17fc4030969dec
      with:
        name: libpvxsIoc
        profile: ${{ env.ABICHECK_PROFILE }}
        baseline-channel: accepted-main
        baseline-path: ${{ env.BASELINE_MAIN_DIR }}
        baseline-required: 'false'
        expected-project-ref: ${{ github.event.pull_request.base.sha }}
        expected-baseline-generation: '1'
        requested-depth: headers
        gate-mode: advisory
        new-library: ${{ fromJSON(steps.snapshots.outputs.snapshot-paths).libpvxsIoc }}
        build-config: .ci-local/abicheck.yml
        head-sha: ${{ github.sha }}
        base-ref: ${{ github.event.pull_request.base.ref }}
        severity-preset: default

    - name: 'libpvxs vs release-contract'
      id: rel-core
      if: ${{ always() && steps.snapshots.outcome == 'success' }}
      uses: abicheck/abicheck/actions/check-target@e38c3f91b8f956f7c8fa51b60d17fc4030969dec
      with:
        name: libpvxs
        profile: ${{ env.ABICHECK_PROFILE }}
        baseline-channel: release-contract
        baseline-path: ${{ env.BASELINE_RELEASE_DIR }}/abicheck-baseline-${{ env.ABICHECK_PROFILE }}.tar.zst
        baseline-required: 'false'
        expected-baseline-generation: '1'
        requested-depth: headers
        gate-mode: advisory
        explicit-id: release
        new-library: ${{ fromJSON(steps.snapshots.outputs.snapshot-paths).libpvxs }}
        build-config: .ci-local/abicheck.yml
        head-sha: ${{ github.sha }}
        severity-preset: default

    - name: 'libpvxsIoc vs release-contract'
      id: rel-ioc
      if: ${{ always() && steps.snapshots.outcome == 'success' }}
      uses: abicheck/abicheck/actions/check-target@e38c3f91b8f956f7c8fa51b60d17fc4030969dec
      with:
        name: libpvxsIoc
        profile: ${{ env.ABICHECK_PROFILE }}
        baseline-channel: release-contract
        baseline-path: ${{ env.BASELINE_RELEASE_DIR }}/abicheck-baseline-${{ env.ABICHECK_PROFILE }}.tar.zst
        baseline-required: 'false'
        expected-baseline-generation: '1'
        requested-depth: headers
        gate-mode: advisory
        explicit-id: release
        new-library: ${{ fromJSON(steps.snapshots.outputs.snapshot-paths).libpvxsIoc }}
        build-config: .ci-local/abicheck.yml
        head-sha: ${{ github.sha }}
        severity-preset: default

    # Each id below is check-target's OWN canonical check-id output. This
    # step selects; it never constructs a target@profile#channel@depth
    # string and never reconstructs the expected set. A step the event did
    # not ask for contributes no id and is not declared; a step that ran but
    # produced no report is declared with an empty report, so it aggregates
    # as unavailable rather than vanishing.
    - name: Declare the checks this event asked for
      id: declare
      if: ${{ always() }}
      env:
        DECLARED: |
          [{"id": "${{ steps.main-core.outputs.check-id }}", "report": "${{ steps.main-core.outputs.report-path }}"},
           {"id": "${{ steps.main-ioc.outputs.check-id }}", "report": "${{ steps.main-ioc.outputs.report-path }}"},
           {"id": "${{ steps.rel-core.outputs.check-id }}", "report": "${{ steps.rel-core.outputs.report-path }}"},
           {"id": "${{ steps.rel-ioc.outputs.check-id }}", "report": "${{ steps.rel-ioc.outputs.report-path }}"}]
      run: |
        set -eu
        python3 -c 'import json,os; print("checks=" + json.dumps([c for c in json.loads(os.environ["DECLARED"]) if c["id"]]))' >> "$GITHUB_OUTPUT"

    # One aggregate document over every declared check. The publisher
    # renders exactly this; it never re-runs a comparison and never
    # classifies a verdict of its own.
    #
    # compatibility-exit carries abicheck aggregate's own 0/1/2/4 without
    # failing the step, which is what keeps this shadow gate advisory. A
    # refused declaration, a usage error, or a document that does not
    # describe a real outcome fails the step instead, so operational loss
    # cannot reach the publisher disguised as an empty finding set.
    - name: Aggregate both components
      id: aggregate
      if: ${{ always() }}
      uses: abicheck/abicheck/actions/aggregate@e38c3f91b8f956f7c8fa51b60d17fc4030969dec
      with:
        reports-dir: ${{ env.REPORT_DIR }}
        manifest-path: ${{ env.EXPECTED_TARGETS }}
        checks: ${{ steps.declare.outputs.checks }}
        # Record WHICH revision this run analysed into the document itself,
        # as five separate fields, so the trusted publisher reads it in one
        # pass instead of parsing a sidecar in a privileged shell. On a
        # pull_request run `github.sha` (the input default) is the ephemeral
        # merge commit -- the same revision the capture recorded. It stays a
        # CLAIM until the publisher verifies it against the API.
        record-analysis-context: 'true'
        profile: ${{ env.ABICHECK_PROFILE }}
        orchestration-ref: ${{ env.ABICHECK_REF }}

    # One canonical bounded renderer: aggregate.txt is abicheck's own
    # summary of the document, and the outputs beside it are the document's
    # own. Nothing here re-derives a cause from report files, and nothing
    # infers one from a count -- zero completed comparisons can mean a
    # missing baseline, a failed capture or a corrupt report, and only the
    # structured outcome knows which.
    - name: Summarise the ABI/API outcome
      if: ${{ always() && steps.aggregate.outcome == 'success' }}
      env:
        AGG: ${{ steps.aggregate.outputs.aggregate-path }}
        STATUS: ${{ steps.aggregate.outputs.status }}
        COVERAGE: ${{ steps.aggregate.outputs.coverage }}
        EXIT: ${{ steps.aggregate.outputs.compatibility-exit }}
        ANALYZED: ${{ steps.aggregate.outputs.analyzed }}
        EXPECTED: ${{ steps.aggregate.outputs.expected }}
        CHANNELS: ${{ steps.aggregate.outputs.channels }}
      run: |
        set -eu
        {
          echo "## ABI/API check (advisory)"
          echo
          echo "\`coverage=$COVERAGE\` \`status=$STATUS\` \`compatibility-exit=$EXIT\` \`analyzed=$ANALYZED/$EXPECTED\`"
          echo
          echo "\`channels=$CHANNELS\`"
          echo
          echo '```'
          cat "$(dirname "$AGG")/aggregate.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload ABI reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        retention-days: 30
        name: abicheck-reports-${{ env.ABICHECK_PROFILE }}
        path: ${{ env.REPORT_DIR }}
        if-no-files-found: error

  docker:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      CMP: ${{ matrix.cmp }}
      BCFG: ${{ matrix.configuration }}
      BASE: ${{ matrix.base }}
      LIBEVENT_TAG: ${{ matrix.libevent }}
      EXTRA: ${{ matrix.extra }}
      VV: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CentOS 7
            image: centos:7
            cmp: gcc
            configuration: default
            base: "7.0"

          - name: Linux fedora latest
            image: fedora:latest
            cmp: gcc
            configuration: default
            base: "7.0"

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Run...
      run: |
        env > env.list
        cat <<EOF > runit.sh
        #!/bin/sh
        set -e -x
        cd /io
        id

        if [ "${{ matrix.image }}" = "centos:7" ]
        then
            sed -i s/mirror.centos.org/vault.centos.org/g /etc/yum.repos.d/*.repo
            sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/*.repo
            sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/*.repo
            yum -y install epel-release
            alias dnf=yum
        fi
        dnf -y install \
          curl make gcc curl-devel expat-devel gettext-devel openssl-devel zlib-devel perl-ExtUtils-MakeMaker \
          python3 gdb make perl gcc-c++ glibc-devel readline-devel ncurses-devel perl-devel libevent-devel \
          sudo re2c git

        # fake out cue.py
        ln -s /bin/true /usr/bin/apt-get

