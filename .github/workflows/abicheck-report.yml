# Trusted publisher for the advisory ABI/API check.
#
# The analysis runs unprivileged in ci-scripts-build.yml, under the
# contributor's own pull request, including from forks.  That job has
# `contents: read` and no secrets, so it cannot comment, and must not be
# given the ability to.  This workflow is the other half.
#
# Almost all of the work is done by two reviewed abicheck Actions rather
# than by logic grown here:
#
#   actions/verify-source-run  establishes WHICH run this is, WHICH pull
#                              request it belongs to, and WHAT commit was
#                              actually analysed -- all from the GitHub
#                              API, never from the artifact -- and extracts
#                              the artifact under size/entry/ratio caps.
#   actions/report             renders the producer's canonical aggregate
#                              document and maintains the sticky comment.
#                              It runs no analysis, no compiler and no
#                              build query.
#
# Neither makes the contributor's report contents trusted evidence.  Origin
# and assurance are preserved; what is enforced is the recipient and
# execution boundary.
#
# DEPLOYMENT PREREQUISITE: workflow_run only ever runs the copy of this
# file on the default branch.  Until a maintainer has merged it there,
# nothing in a pull request -- including the pull request that adds this
# file -- publishes a comment.  That is by design.

name: ABI/API report

on:
  workflow_run:
    workflows: ["PVXS EPICS"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  # One publication at a time per pull request and profile, so two producer
  # runs for the same PR cannot interleave their comment updates.  Keyed on
  # the producer's head branch because the PR number is only known after
  # verification.  Superseded runs are NOT cancelled: ordering is enforced
  # by the publisher's own freshness check against what is already on the
  # pull request, which cancellation alone cannot do.
  group: >-
    abicheck-report-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}-linux-x86_64-gcc-default-base7.0-bundled-libevent
  cancel-in-progress: false

jobs:
  publish:
    # Only a pull-request-triggered producer has a pull request to report
    # to.  A push/tag run publishes baselines instead (abicheck-baseline.yml).
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ABICHECK_PROFILE: linux-x86_64-gcc-default-base7.0-bundled-libevent
    steps:
    # Establishes identity and hands back a verified artifact.  Every
    # coordinate below comes from the API: the artifact is contributor
    # controlled and may claim any repository, pull request or SHA.
    #
    # `allowed-conclusions` is deliberately empty.  A producer run that
    # failed for an unrelated reason (a flaky platform test) still has a
    # real ABI result to report, and a failed analysis must be published as
    # an explicit incomplete state rather than silently withheld.  What is
    # never inferred is a compatibility outcome from the run's conclusion.
    - name: Verify the producer run and fetch its reports
      id: source
      uses: abicheck/abicheck/actions/verify-source-run@80cf72abb5856eb623a6056fb35d06a66ad26774
      with:
        source-run-id: ${{ github.event.workflow_run.id }}
        expect-repository: ${{ github.repository }}
        expect-workflow: .github/workflows/ci-scripts-build.yml
        expect-event: pull_request
        # Bind to the attempt that actually triggered this publication, not
        # to whatever attempt the API reports by the time we ask.
        expect-run-attempt: ${{ github.event.workflow_run.run_attempt }}
        allowed-conclusions: ''
        artifact-name: abicheck-reports-${{ env.ABICHECK_PROFILE }}
        destination: ${{ runner.temp }}/abicheck-reports
        github-token: ${{ github.token }}

    - name: Refuse to publish an unverified run
      if: ${{ steps.source.outputs.verified != 'true' }}
      run: |
        echo "::error::refusing to publish: ${{ steps.source.outputs.refusal-code }}"
        exit 1

    # `sha` is the commit that was ACTUALLY analysed.  For a pull_request
    # producer that is the ephemeral merge commit, not the pull request
    # head -- verify-source-run returns them as separate coordinates and
    # has already verified their association.  Do not substitute one for
    # the other.
    - name: Publish the ABI/API report
      id: publish
      uses: abicheck/abicheck/actions/report@80cf72abb5856eb623a6056fb35d06a66ad26774
      with:
        report: ${{ steps.source.outputs.artifact-path }}/aggregate.json
        repository: ${{ github.repository }}
        pr-number: ${{ steps.source.outputs.pr-number }}
        sha: ${{ steps.source.outputs.tested-sha }}
        profile: ${{ env.ABICHECK_PROFILE }}
        # Order the sticky comment by the PRODUCER's run, not this
        # publisher's.  Left unset these default to the publisher's own run
        # id, which orders by when publication was triggered -- so a late
        # re-run of an older commit would look newer than the current
        # result and overwrite it, which is the inversion the guard exists
        # to prevent.
        source-run-id: ${{ github.event.workflow_run.id }}
        source-run-attempt: ${{ github.event.workflow_run.run_attempt }}
        # `always`, not `changes`: a run whose comparison came back clean
        # must still publish, otherwise the sticky comment left by an
        # earlier run keeps showing a warning that no longer holds.  An
        # incomplete analysis already counts as a change, so `changes`
        # would publish that -- it is specifically the clean resolution it
        # would silently skip.
        post-on: always
        detail: standard
        run-label: >-
          run ${{ github.event.workflow_run.id }}
          (attempt ${{ github.event.workflow_run.run_attempt }})
        report-url: ${{ github.event.workflow_run.html_url }}
        job-summary: 'true'
        github-token: ${{ github.token }}

    # A publication failure is an operational failure of this workflow and
    # is reported as one.  It is never allowed to look like a clean
    # compatibility result, and a compatibility verdict never fails this
    # workflow -- this is a reporting job, not a gate.
    - name: Report the publication outcome
      if: ${{ always() && steps.source.outputs.verified == 'true' }}
      run: |
        set -eu
        echo "posted=${{ steps.publish.outputs.posted }}"
        echo "skipped-reason=${{ steps.publish.outputs.skipped-reason }}"
        echo "pr=${{ steps.source.outputs.pr-number }} tested-sha=${{ steps.source.outputs.tested-sha }} pr-head=${{ steps.source.outputs.pr-head-sha }} from-fork=${{ steps.source.outputs.from-fork }}"
        if [ "${{ steps.publish.outcome }}" != "success" ]; then
          echo "::error::the ABI/API report could not be published (the analysis result itself is unaffected)"
          exit 1
        fi
