# Trusted publisher for the advisory ABI/API check.
#
# The analysis that produces the reports runs unprivileged, in
# ci-scripts-build.yml, under the contributor's own pull request -- including
# pull requests from forks.  That job has `contents: read` and no secrets, so
# it cannot comment, and it must not be given the ability to.
#
# This workflow is the other half.  It runs from the repository's default
# branch, on workflow_run, with only the two permissions a comment actually
# needs.  It never checks out, installs, imports or executes anything the
# pull request produced: it downloads that run's report artifact, treats
# every byte of it as untrusted data, and renders it with reviewed,
# pinned publisher code.
#
# It does not make the contributor's reports trusted evidence.  The reports
# say where they came from and how complete they are, and that is preserved.
# What this workflow enforces is who the result may be delivered to and what
# is allowed to execute while delivering it.
#
# DEPLOYMENT PREREQUISITE: workflow_run only ever runs the copy of this file
# on the default branch.  Until a maintainer has merged it there, nothing in
# a pull request -- including the pull request that adds this file -- will
# publish a comment.  That is by design and must not be worked around.

name: ABI/API report

on:
  workflow_run:
    workflows: ["PVXS EPICS"]
    types: [completed]

# Only what publishing a comment needs.  No contents: write, no packages,
# no id-token, no secrets.
permissions:
  actions: read
  pull-requests: write

concurrency:
  # One in-flight publication per producer run.  Superseded runs are NOT
  # cancelled: ordering is enforced by the publisher's own freshness check
  # against what is already on the pull request, because cancellation alone
  # cannot stop an older run that has already started from finishing last.
  group: abicheck-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    # Only a pull-request-triggered producer run has a pull request to
    # report to.  A push/tag run publishes baselines instead (see
    # abicheck-baseline.yml) and is ignored here.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ABICHECK_PROFILE: linux-x86_64-gcc-default-base7.0-bundled-libevent
      REPORTS: ${{ runner.temp }}/abicheck-reports
    steps:
    # ── 1. Establish who this run is, and who it is allowed to talk to ──
    #
    # Everything below comes from the GitHub API, never from the artifact:
    # the artifact is contributor-controlled and may claim any repository,
    # pull request or SHA it likes.
    - name: Resolve and verify the producer run
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        set -euo pipefail

        run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")

        # Repository, workflow identity and event must all be what we expect.
        test "$(jq -r '.repository.full_name' <<<"$run_json")" = "$GITHUB_REPOSITORY"
        test "$(jq -r '.path' <<<"$run_json")" = ".github/workflows/ci-scripts-build.yml"
        test "$(jq -r '.event' <<<"$run_json")" = "pull_request"

        attempt=$(jq -r '.run_attempt' <<<"$run_json")
        head_sha=$(jq -r '.head_sha' <<<"$run_json")
        conclusion=$(jq -r '.conclusion' <<<"$run_json")

        # Resolve the pull request through the API, by the producer run's own
        # head SHA.  Exactly one open pull request must match; anything else
        # is ambiguous and fails visibly rather than guessing a recipient.
        prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls" \
                --jq '[.[] | select(.state == "open") | .number]')
        count=$(jq 'length' <<<"$prs")
        if [ "$count" != "1" ]; then
          echo "::error::cannot unambiguously associate run $RUN_ID (head $head_sha) with a pull request: matched $count"
          exit 1
        fi
        pr=$(jq -r '.[0]' <<<"$prs")

        pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")
        pr_head_sha=$(jq -r '.head.sha' <<<"$pr_json")

        # The PR head SHA and the SHA that was actually built are different
        # things: for a pull_request event the producer builds the merge
        # commit.  Both are reported; neither is assumed to be the other.
        # What is verified is that the merge commit really descends from the
        # current PR head.
        if [ "$head_sha" != "$pr_head_sha" ]; then
          parents=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha" --jq '[.parents[].sha]')
          if ! jq -e --arg s "$pr_head_sha" 'index($s)' >/dev/null <<<"$parents"; then
            echo "::error::built commit $head_sha is not a merge of the current pull request head $pr_head_sha (the pull request moved); refusing to publish a stale result"
            exit 1
          fi
        fi

        {
          echo "pr=$pr"
          echo "run-id=$RUN_ID"
          echo "run-attempt=$attempt"
          echo "build-sha=$head_sha"
          echo "pr-head-sha=$pr_head_sha"
          echo "conclusion=$conclusion"
        } >> "$GITHUB_OUTPUT"

    # ── 2. Fetch the reports from that exact run ────────────────────────
    - name: Download the report artifact
      id: artifact
      continue-on-error: true
      uses: actions/download-artifact@v7
      with:
        name: abicheck-reports-${{ env.ABICHECK_PROFILE }}
        path: ${{ env.REPORTS }}
        run-id: ${{ steps.source.outputs.run-id }}
        github-token: ${{ github.token }}

    # ── 3. Publish ─────────────────────────────────────────────────────
    #
    # The publisher installs nothing but abicheck itself, runs no compiler,
    # no build query and no analysis, and renders the aggregate document the
    # producer already wrote.  Two components, two baseline channels, one
    # comment.
    #
    # NOTE: this step is pending abicheck's `actions/report`, which does not
    # exist on abicheck main yet.  See documentation/abicheck.md for the
    # dependency and the exact revision this workflow was tested against.
    # Do not point it at a mutable ref.
    - name: Publish the ABI/API report
      if: ${{ steps.artifact.outcome == 'success' }}
      uses: abicheck/abicheck/actions/report@PENDING_ABICHECK_REPORT_ACTION_SHA
      with:
        report: ${{ env.REPORTS }}/aggregate.json
        repository: ${{ github.repository }}
        pr-number: ${{ steps.source.outputs.pr }}
        sha: ${{ steps.source.outputs.build-sha }}
        comment-identity: abicheck/${{ env.ABICHECK_PROFILE }}
        run-label: >-
          run ${{ steps.source.outputs.run-id }}
          (attempt ${{ steps.source.outputs.run-attempt }})
        report-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run-id }}
        detail: standard
        on: changes
        job-summary: 'true'
        github-token: ${{ github.token }}

    # A failed or missing analysis is reported as a failed or missing
    # analysis, on the pull request, where the association was established.
    # It is never allowed to look like a clean compatibility result, and it
    # is never inferred from the producer run's overall conclusion -- an
    # unrelated red test leg does not mean the ABI check failed.
    - name: Publish an incomplete-analysis notice
      if: ${{ steps.artifact.outcome != 'success' }}
      uses: abicheck/abicheck/actions/report@PENDING_ABICHECK_REPORT_ACTION_SHA
      with:
        report: ''
        incomplete-reason: >-
          No ABI/API report artifact was produced by run
          ${{ steps.source.outputs.run-id }}. The comparison did not complete;
          this is not a statement that no changes were found.
        repository: ${{ github.repository }}
        pr-number: ${{ steps.source.outputs.pr }}
        sha: ${{ steps.source.outputs.build-sha }}
        comment-identity: abicheck/${{ env.ABICHECK_PROFILE }}
        run-label: run ${{ steps.source.outputs.run-id }}
        report-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run-id }}
        on: always
        github-token: ${{ github.token }}
