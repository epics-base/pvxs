name: ABICheck shadow ABI scan

on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: abicheck-shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The scanner is an advisory, parallel signal.  It needs no PR comments, no
# status write access, and no repository secrets.
permissions:
  contents: read

jobs:
  abicheck-shadow:
    runs-on: ubuntu-latest
    # An L2 build-evidence scan runs two revisions of both public DSOs.
    # Keep this above the measured ~100-minute worst case, not at 45 minutes.
    timeout-minutes: 120
    env:
      SETUP_PATH: .ci-local
      SET: defaults
      CMP: gcc
      BCFG: default
      BASE: "7.0"
      _PVXS_ABORT_ON_CRIT: 1
      PVXS_LOG: pvxs.*=WARN
      ABICHECK_MAKE_JOBS: "2"
      ABICHECK_REF: fb423dfd62c267b0db61739941f2d35ee2dacb16

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: "0"
        submodules: true
        persist-credentials: false

    - name: Install scanner tools
      shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update
        sudo apt-get -y install libreadline-dev libevent-dev cmake bear
        /usr/share/miniconda/bin/conda install -y -c conda-forge castxml
        VENV="$RUNNER_TEMP/abicheck-venv"
        python -m venv "$VENV"
        "$VENV/bin/pip" install --disable-pip-version-check \
          "git+https://github.com/abicheck/abicheck@${ABICHECK_REF}"
        echo "/usr/share/miniconda/bin" >> "$GITHUB_PATH"
        echo "$VENV/bin" >> "$GITHUB_PATH"
        echo "ABICHECK=$VENV/bin/abicheck" >> "$GITHUB_ENV"

    - name: Verify scanner tools
      shell: bash
      run: |
        set -euxo pipefail
        castxml --version
        "$ABICHECK" --version

    - name: Prepare EPICS dependencies
      run: python .ci/cue.py prepare

    - name: Run L2 build-evidence shadow scan
      run: python .ci/cue.py exec ./.ci-local/abicheck-diff.sh

    - name: Upload ABICheck reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        retention-days: 30
        name: abicheck-shadow
        path: compat_reports/abicheck
        if-no-files-found: error
