# Publish the release-contract ABI baseline-set for the selected profile.
#
# Two paths, both running only from this repository's default branch:
#
#   automatic   A tag build of PVXS EPICS already captured the tagged
#               revision. This packages that capture and attaches it to the
#               release. Nothing is rebuilt.
#
#   bootstrap   A historical release predates the capture integration, so
#               no tag build of it ever produced a baseline-set. Dispatching
#               the old workflow cannot help: the workflow AT that tag has
#               no capture step. This path therefore builds the requested
#               revision once, here, with the current trusted tooling, and
#               publishes the result. It is a one-time operation per
#               release, never part of a pull request.
#
# Trust boundary: publication happens only for a verified tag of this
# repository, from a successful producer run (automatic) or from a build
# this trusted workflow performed itself (bootstrap). A snapshot produced
# by contributor code can never reach the release-contract channel.
#
# The accepted-main channel needs nothing here: a pull request resolves it
# from the successful default-branch run for its own base commit.

name: ABI baseline

on:
  workflow_run:
    workflows: ["PVXS EPICS"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, capture and publish a baseline-set for.'
        required: true
        type: string
      overwrite:
        description: >
          Replace an existing asset of the same name. Off by default: a
          published baseline is an immutable reference, and silently
          replacing it changes the meaning of every past comparison.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  ABICHECK_PROFILE: linux-x86_64-gcc-default-base7.0-bundled-libevent
  ABICHECK_REF: 80cf72abb5856eb623a6056fb35d06a66ad26774
  SETUP_PATH: .ci-local
  CMP: gcc
  BCFG: default
  BASE: "7.0"
  SET: defaults

jobs:
  # ── Automatic: package the tag build's own capture ────────────────────
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    # Two questions, both answered by the shared verifier rather than by
    # hand-written gh/jq here:
    #   1. may a baseline be taken from this producer run at all?
    #   2. is the name it built really a tag, and does that tag name the
    #      exact commit that was built?
    # PVXS tags are bare versions ("1.5.2"), not "v"-prefixed; the verifier
    # assumes no prefix and resolves refs/tags/<name> explicitly, peeling an
    # annotated tag rather than treating the tag object as the commit.
    - name: Verify the producer run
      id: producer
      uses: abicheck/abicheck/actions/verify-baseline-source@80cf72abb5856eb623a6056fb35d06a66ad26774
      with:
        mode: producer-run
        workflow: .github/workflows/ci-scripts-build.yml
        expect-event: push
        expect-head-sha: ${{ github.event.workflow_run.head_sha }}
        expect-head-branch: ${{ github.event.workflow_run.head_branch }}

    - name: Verify the tag identity
      id: tag
      if: ${{ steps.producer.outputs.eligible == 'true' }}
      uses: abicheck/abicheck/actions/verify-baseline-source@80cf72abb5856eb623a6056fb35d06a66ad26774
      with:
        mode: tag
        tag: ${{ github.event.workflow_run.head_branch }}
        built-sha: ${{ github.event.workflow_run.head_sha }}

    - name: Note why nothing will be published
      if: ${{ steps.producer.outputs.eligible != 'true' || steps.tag.outputs.eligible != 'true' }}
      run: |
        echo "producer outcome: ${{ steps.producer.outputs.outcome || 'not evaluated' }}"
        echo "tag outcome:      ${{ steps.tag.outputs.outcome || 'not evaluated' }}"
        echo "nothing to publish from this run."

    - uses: actions/download-artifact@v7
      if: ${{ steps.tag.outputs.eligible == 'true' }}
      with:
        name: abicheck-candidate-${{ env.ABICHECK_PROFILE }}
        path: ${{ runner.temp }}/baseline-set
        run-id: ${{ steps.producer.outputs.run-id }}
        github-token: ${{ github.token }}

    - name: Publish the baseline-set
      if: ${{ steps.tag.outputs.eligible == 'true' }}
      uses: ./.github/actions/abicheck-publish-baseline
      with:
        baseline-path: ${{ runner.temp }}/baseline-set
        profile: ${{ env.ABICHECK_PROFILE }}
        tag: ${{ github.event.workflow_run.head_branch }}
        overwrite: 'false'
        github-token: ${{ github.token }}

  # ── Bootstrap: build a historical release once, here ──────────────────
  # ── Bootstrap: build a historical release once, here ──────────────────
  #
  # Split in two on purpose.  The build job runs the requested revision's
  # own code (cue.py, its submodules, its makefiles) and therefore holds
  # NO write scope: `contents: read` only.  It hands the captured
  # baseline-set to the publishing job as an artifact.
  #
  # The publishing job holds `contents: write` but executes none of that
  # code -- it checks out only the default branch and consumes the
  # artifact.  Without the split, historical code could overwrite
  # .github/actions/abicheck-publish-baseline in the shared workspace
  # before the runner loads it, and that local action is handed
  # github.token.
  bootstrap-build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
    # The trusted tooling (capture action, component declaration) comes
    # from the default branch; the revision being captured is checked out
    # separately, under historical/.  The historical tree's own workflow is
    # never run.
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Verify the requested tag
      id: tag
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
        obj_sha=$(jq -r '.object.sha' <<<"$ref")
        if [ "$(jq -r '.object.type' <<<"$ref")" = "tag" ]; then
          obj_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.object.sha')
        fi
        echo "sha=$obj_sha" >> "$GITHUB_OUTPUT"

    - name: Check out the historical revision
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.tag.outputs.sha }}
        submodules: true
        persist-credentials: false
        path: historical

    - name: apt-get install
      run: |
        sudo apt-get update
        sudo apt-get -y install libreadline-dev cmake

    - name: Build the historical revision
      working-directory: historical
      run: |
        set -eu
        python .ci/cue.py prepare
        python .ci/cue.py exec python .ci-local/libevent.py
        python .ci/cue.py build

    # Captures with the same declaration and the same shared action the
    # matrix leg uses, so the bootstrap cannot drift from normal capture.
    # The declaration is read from THIS checkout, not from the historical
    # revision, which predates it.
    - name: Capture the historical revision
      id: capture
      uses: ./.github/actions/abicheck-capture
      with:
        top: ${{ github.workspace }}/historical
        output-dir: ${{ runner.temp }}/baseline-set
        project-ref: ${{ steps.tag.outputs.sha }}
        profile: ${{ env.ABICHECK_PROFILE }}
        abicheck-ref: ${{ env.ABICHECK_REF }}

    - name: Hand the baseline-set to the publishing job
      uses: actions/upload-artifact@v7
      with:
        name: abicheck-bootstrap-${{ env.ABICHECK_PROFILE }}
        path: ${{ runner.temp }}/baseline-set
        if-no-files-found: error
        retention-days: 1

  bootstrap-publish:
    needs: bootstrap-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    # Default branch only.  No historical checkout, no historical code, so
    # the local action loaded below is the reviewed one.
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/download-artifact@v7
      with:
        name: abicheck-bootstrap-${{ env.ABICHECK_PROFILE }}
        path: ${{ runner.temp }}/baseline-set

    - name: Publish the baseline-set
      uses: ./.github/actions/abicheck-publish-baseline
      with:
        baseline-path: ${{ runner.temp }}/baseline-set
        profile: ${{ env.ABICHECK_PROFILE }}
        tag: ${{ inputs.tag }}
        overwrite: ${{ inputs.overwrite }}
        github-token: ${{ github.token }}
